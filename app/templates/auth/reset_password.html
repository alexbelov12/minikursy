{% extends "base.html" %}
{% block title %}{{ t('auth.reset_title') }} — {{ t('nav.brand') }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="panel">
                <div class="text-center mb-4">
                    <div class="mb-3" style="width:56px;height:56px;background:#dcfce7;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto;">
                        <i class="fas fa-lock" style="color:#16a34a;font-size:1.4rem;"></i>
                    </div>
                    <h3 class="fw-bold mb-1">{{ t('auth.reset_title') }}</h3>
                    <p class="text-muted small">{{ t('auth.reset_subtitle') }}</p>
                </div>
                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="password">{{ t('auth.reset_new_pass') }}</label>
                        <input type="password" name="password" id="password" class="form-control"
                               placeholder="{{ t('auth.password_min') }}" required autocomplete="new-password">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="confirm_password">{{ t('auth.reset_confirm') }}</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control"
                               placeholder="{{ t('auth.confirm_placeholder') }}" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-semibold">
                        <i class="fas fa-check me-2"></i>{{ t('auth.reset_btn') }}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

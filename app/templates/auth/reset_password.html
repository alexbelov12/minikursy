{% extends "base.html" %}
{% block title %}Новый пароль — {{ t('nav.brand') }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="panel">
                <div class="text-center mb-4">
                    <div class="mb-3" style="width:56px;height:56px;background:#dcfce7;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto;">
                        <i class="fas fa-lock" style="color:#16a34a;font-size:1.4rem;"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Новый пароль</h3>
                    <p class="text-muted small">Придумайте новый пароль для вашего аккаунта</p>
                </div>
                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="password">Новый пароль</label>
                        <input type="password" name="password" id="password" class="form-control"
                               placeholder="Минимум 6 символов" required autocomplete="new-password">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="confirm_password">Подтвердите пароль</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control"
                               placeholder="Повторите пароль" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-semibold">
                        <i class="fas fa-check me-2"></i>Сохранить пароль
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ t('auth.register_title') }} — {{ t('nav.brand') }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-6 col-lg-5">
            <div class="card auth-card p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-user-plus text-primary display-4" aria-hidden="true"></i>
                    <h2 class="fw-bold mt-2">{{ t('auth.register_title') }}</h2>
                    <p class="text-muted">{{ t('auth.register_subtitle') }}</p>
                </div>
                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="username">{{ t('auth.username') }}</label>
                        <div class="input-group">
                            <span class="input-group-text" aria-hidden="true">
                                <i class="fas fa-user text-muted"></i>
                            </span>
                            <input type="text" name="username" id="username" class="form-control"
                                   placeholder="{{ t('auth.username_placeholder') }}" required
                                   autocomplete="username" aria-required="true">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="reg_email">Email</label>
                        <div class="input-group">
                            <span class="input-group-text" aria-hidden="true">
                                <i class="fas fa-envelope text-muted"></i>
                            </span>
                            <input type="email" name="email" id="reg_email" class="form-control"
                                   placeholder="your@email.com" required
                                   autocomplete="email" aria-required="true">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="reg_password">{{ t('auth.password') }}</label>
                        <div class="input-group">
                            <span class="input-group-text" aria-hidden="true">
                                <i class="fas fa-lock text-muted"></i>
                            </span>
                            <input type="password" name="password" id="reg_password" class="form-control"
                                   placeholder="{{ t('auth.password_min') }}" required minlength="6"
                                   autocomplete="new-password" aria-required="true">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="confirm_password">
                            {{ t('auth.confirm_password') }}
                        </label>
                        <div class="input-group">
                            <span class="input-group-text" aria-hidden="true">
                                <i class="fas fa-lock text-muted"></i>
                            </span>
                            <input type="password" name="confirm_password" id="confirm_password" class="form-control"
                                   placeholder="{{ t('auth.confirm_placeholder') }}" required
                                   autocomplete="new-password" aria-required="true">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="fas fa-user-plus me-2" aria-hidden="true"></i>{{ t('auth.register_btn') }}
                    </button>
                </form>
                <hr>
                <p class="text-center text-muted mb-0">
                    {{ t('auth.have_account') }}
                    <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">
                        {{ t('auth.login_btn') }}
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

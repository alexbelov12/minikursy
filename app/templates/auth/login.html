{% extends "base.html" %}
{% block title %}{{ t('auth.login_title') }} — {{ t('nav.brand') }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-6 col-lg-5">
            <div class="card auth-card p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-graduation-cap text-primary display-4" aria-hidden="true"></i>
                    <h2 class="fw-bold mt-2">{{ t('auth.login_title') }}</h2>
                    <p class="text-muted">{{ t('auth.login_subtitle') }}</p>
                </div>
                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="email">Email</label>
                        <div class="input-group">
                            <span class="input-group-text" aria-hidden="true">
                                <i class="fas fa-envelope text-muted"></i>
                            </span>
                            <input type="email" name="email" id="email" class="form-control"
                                   placeholder="your@email.com" required
                                   autocomplete="email" aria-required="true">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="password">{{ t('auth.password') }}</label>
                        <div class="input-group">
                            <span class="input-group-text" aria-hidden="true">
                                <i class="fas fa-lock text-muted"></i>
                            </span>
                            <input type="password" name="password" id="password" class="form-control"
                                   placeholder="{{ t('auth.password_placeholder') }}" required
                                   autocomplete="current-password" aria-required="true">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="fas fa-sign-in-alt me-2" aria-hidden="true"></i>{{ t('auth.login_btn') }}
                    </button>
                </form>
                <div class="text-center mt-2">
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-muted small">
                        Забыли пароль?
                    </a>
                </div>
                <hr>
                <p class="text-center text-muted mb-0">
                    {{ t('auth.no_account') }}
                    <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold">
                        {{ t('auth.register_link') }}
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
